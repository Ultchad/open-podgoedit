# Static hosting for the built web UI. No proxy, no backend: the page only
# serves its own assets and talks to WebUSB from the browser.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Hashed bundles never change in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidate the entry point so a deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
