name: CI

# Quality gates for the offline core and the static web page. Pages deployment
# is separate: `.github/workflows/pages.yml` only runs on `main`.
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --offline -- -D warnings

      - name: Test offline core
        run: cargo test --workspace --all-features --offline

  web:
    name: Web UI and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/wasm

      # Must match the `wasm-bindgen` crate version in apps/web/wasm/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - name: Check WASM crate formatting
        run: cargo fmt --manifest-path apps/web/wasm/Cargo.toml -- --check

      - name: Lint WASM crate
        run: cargo clippy --manifest-path apps/web/wasm/Cargo.toml --all-targets -- -D warnings

      - name: Test WASM host bindings
        run: cargo test --manifest-path apps/web/wasm/Cargo.toml

      - name: Install npm dependencies
        working-directory: apps/web
        run: npm ci

      # `npm run build` runs prebuild → wasm + fixtures → tsc + vite.
      - name: Type-check and build
        working-directory: apps/web
        run: npm run build

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: apps/web
        run: npx playwright test

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
