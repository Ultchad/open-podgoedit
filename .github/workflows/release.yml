name: Release

# Builds the signed Android APK and the offline web bundle, then publishes a
# GitHub Release. Push a tag like `v0.2.0` on `main` to run it.
#
# Signing uses four repository secrets (see docs/ANDROID.md):
#   PODGO_KEYSTORE_BASE64      the .jks file, base64 encoded
#   PODGO_KEYSTORE_PASSWORD
#   PODGO_KEY_ALIAS
#   PODGO_KEY_PASSWORD
# Without them the workflow still publishes, but the APK is unsigned.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp and publish, e.g. 0.2.0
        required: true
        default: 0.2.0
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          TAG_REF: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${TAG_REF#v}"
            tag="$TAG_REF"
          else
            version="$INPUT_VERSION"
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install the platforms explicitly: the action's default package
      # list includes `tools`, which newer SDK repositories no longer ship.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/wasm

      # Must match the `wasm-bindgen` crate version in apps/web/wasm/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - name: Install npm dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit runtime dependencies
        working-directory: apps/web
        run: npm run audit:runtime

      # `npm run build` runs prebuild → wasm + fixtures → tsc + vite.
      # A relative base keeps the bundle valid wherever it is unpacked.
      - name: Build web bundle
        working-directory: apps/web
        env:
          VITE_BASE: ./
        run: npm run build

      - name: Copy bundle into the Android app
        run: node apps/android/tools/sync-web-assets.mjs

      # Two accepted shapes:
      #   1. one secret, ANDROID_KEYSTORE, holding the whole key=value file
      #      (PODGO_KEYSTORE_BASE64=…, PODGO_KEYSTORE_PASSWORD=…, …);
      #   2. the four PODGO_* secrets set individually.
      # A keystore that does not open with the given password fails here, so a
      # broken secret can never produce a silent unsigned release by accident.
      - name: Prepare signing
        id: keystore
        env:
          BUNDLE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_BASE64: ${{ secrets.PODGO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PODGO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PODGO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PODGO_KEY_PASSWORD }}
          MASK_VALUES: >-
            ${{ secrets.ANDROID_KEYSTORE }}
            ${{ secrets.PODGO_KEYSTORE_BASE64 }}
            ${{ secrets.PODGO_KEYSTORE_PASSWORD }}
            ${{ secrets.PODGO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Exporting PODGO_SIGNING_* through GITHUB_ENV made GitHub print the
          # whole step environment, passwords included, into a public log.
          # Secrets are masked before they reach the environment, the values
          # are registered with ::add-mask::, and Gradle reads the keystore from
          # a properties file instead of environment variables.
          for value in $MASK_VALUES; do
            echo "::add-mask::$value"
          done
          if [ -n "${BUNDLE:-}" ]; then
            printf '%s\n' "$BUNDLE" > "$RUNNER_TEMP/keystore.env"
            set -a
            # shellcheck disable=SC1090
            . "$RUNNER_TEMP/keystore.env"
            set +a
            for value in "${PODGO_KEYSTORE_BASE64:-}" \
                "${PODGO_KEYSTORE_PASSWORD:-}" "${PODGO_KEY_PASSWORD:-}"; do
              [ -z "$value" ] || echo "::add-mask::$value"
            done
            KEYSTORE_BASE64="${PODGO_KEYSTORE_BASE64:-}"
            KEYSTORE_PASSWORD="${PODGO_KEYSTORE_PASSWORD:-}"
            KEY_ALIAS="${PODGO_KEY_ALIAS:-}"
            KEY_PASSWORD="${PODGO_KEY_PASSWORD:-}"
          fi
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No signing secrets found; the APK will be unsigned."
            exit 0
          fi
          missing=""
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="PODGO_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ] || missing="${missing:+$missing, }PODGO_KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ] || missing="${missing:+$missing, }PODGO_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::ANDROID_KEYSTORE is incomplete; missing: $missing"
            exit 1
          fi

          keystore="$RUNNER_TEMP/podgo-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if ! keytool -list -keystore "$keystore" \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore does not open with these credentials (wrong password, alias or base64)."
            exit 1
          fi
          # Gradle reads this file (see apps/android/app/build.gradle.kts); it is
          # outside the workspace and never printed.
          properties="$RUNNER_TEMP/podgo-keystore.properties"
          umask 077
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$properties"
          {
            echo "PODGO_SIGNING_PROPERTIES=$properties"
          } >> "$GITHUB_ENV"
          echo "file=$keystore" >> "$GITHUB_OUTPUT"
          echo "Signing with alias '$KEY_ALIAS'."

      - name: Build release APK
        working-directory: apps/android
        env:
          PODGO_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          # A blank PODGO_VERSION_NAME would fail Gradle's version parsing.
          ./gradlew assembleRelease --no-daemon

      - name: Name artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="apps/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "apps/android/app/build/outputs/apk/release/app-release.apk" ]; then
            apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          fi
          cp "$apk" "$RUNNER_TEMP/podgo-editor-$VERSION.apk"
          echo "apk=$RUNNER_TEMP/podgo-editor-$VERSION.apk" >> "$GITHUB_OUTPUT"
          if [ -n "${{ steps.keystore.outputs.file }}" ]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
              "$RUNNER_TEMP/podgo-editor-$VERSION.apk" > "$RUNNER_TEMP/signing.txt"
          else
            echo "Unsigned build: installable with adb install or an `Unknown sources` toggle." \
              > "$RUNNER_TEMP/signing.txt"
          fi
          (cd apps/web/dist && zip -qry "$RUNNER_TEMP/podgo-editor-$VERSION-web.zip" .)

      # The workspace copy of the release notes is reused when the tag has
      # nothing specific, so a release always says what changed.
      - name: Compose release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING: ${{ runner.temp }}/signing.txt
        run: |
          {
            echo "POD Go Editor $VERSION"
            echo
            echo "Unofficial POD Go preset editor. Reads are always available; every pedal write"
            echo "stays opt-in, confirmed and unvalidated on hardware."
            echo
            echo "### Downloads"
            echo "- \`podgo-editor-$VERSION.apk\`: Android 8.0+ (WebView, USB host). Install with"
            echo "  \`adb install\` or after allowing installs from this source."
            echo "- \`podgo-editor-$VERSION-web.zip\`: the same app as static files; unzip and serve"
            echo "  over HTTPS (WebUSB needs a secure context)."
            echo
            echo "### Changed"
            awk '/^## \[Unreleased\]/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md
            echo
            echo "### Signing"
            echo '```'
            cat "$SIGNING"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: POD Go Editor ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ runner.temp }}/podgo-editor-${{ steps.version.outputs.version }}-web.zip
