[package]
name = "podgo-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false
description = "Browser bindings for the POD Go domain core (local web test harness)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.130"
podgo-cli = { path = "../../../apps/podgo-cli" }
podgo-domain = { path = "../../../crates/podgo-domain" }
podgo-protocol = { path = "../../../crates/podgo-protocol", features = ["device-write"] }

# Keep this crate outside the repository workspace so `cargo test --workspace`
# and the offline core build remain dependency-free.
[workspace]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
