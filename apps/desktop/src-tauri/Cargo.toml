[package]
name = "podgo-desktop"
version = "0.4.0"
description = "Unofficial POD Go editor desktop shell"
edition = "2021"
rust-version = "1.82"
license = "MIT"

# The Tauri shell is its own workspace: the root workspace builds the offline
# crates and the WASM module, while this one pulls the platform WebView stack.
[workspace]

[lib]
name = "podgo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
